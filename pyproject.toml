[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patkeano20-mixed_precision_overflow_length_profile"
version = "0.1.0"
description = "按段落统计大模型推理优化工程师·混合精度的溢出与下溢相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "patkeano20" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://patkeano20.github.io"
Repository = "https://github.com/patkeano20/mixed_precision_overflow_length_profile"
Issues = "https://github.com/patkeano20/mixed_precision_overflow_length_profile/issues"

[project.scripts]
mixed_precision_overflow_length_profile = "mixed_precision_overflow_length_profile:main"

[tool.setuptools]
py-modules = ["mixed_precision_overflow_length_profile"]
